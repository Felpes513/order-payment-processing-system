spring.application.name=inventory-service

# Credenciais locais (execucao pela raiz ou pela pasta do servico)
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Docker Compose
spring.docker.compose.enabled=false

# PostgreSQL
spring.datasource.url=${INVENTORY_DATABASE_URL:jdbc:postgresql://localhost:5434/inventory_db}
spring.datasource.username=${INVENTORY_DATABASE_USERNAME:inventory_user}
spring.datasource.password=${INVENTORY_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Servidor
server.port=8082

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
